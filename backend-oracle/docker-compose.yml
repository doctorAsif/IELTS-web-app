version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/usr/share/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build: .
    restart: always
    environment:
      - PORT=8000
      - SUPABASE_URL=https://uajkqjpfxmshstfhtesg.supabase.co
    ports:
      - "8000:8000"

volumes:
  caddy_data:
  caddy_config:
